<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Academy - Perfil</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <div class="page-header">
            <h2>Meu Perfil</h2>
        </div>

        <!-- Profile Information -->
        <div class="profile-section">
            <h3>Informações Pessoais</h3>
            <form id="profileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Nome Completo *</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required disabled>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00">
                    </div>
                    <div class="form-group">
                        <label for="orcid">ORCID</label>
                        <input type="text" id="orcid" placeholder="0000-0000-0000-0000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="addressLine1">Endereço (Linha 1)</label>
                    <input type="text" id="addressLine1">
                </div>

                <div class="form-group">
                    <label for="addressLine2">Endereço (Linha 2)</label>
                    <input type="text" id="addressLine2">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Cidade</label>
                        <input type="text" id="city">
                    </div>
                    <div class="form-group">
                        <label for="stateProvince">Estado/Província</label>
                        <input type="text" id="stateProvince">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="postalCode">CEP/Código Postal</label>
                        <input type="text" id="postalCode">
                    </div>
                    <div class="form-group">
                        <label for="country">País</label>
                        <input type="text" id="country">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="medicalSchool">Faculdade de Medicina</label>
                        <input type="text" id="medicalSchool">
                    </div>
                    <div class="form-group">
                        <label for="graduationDate">Data de Formatura</label>
                        <input type="date" id="graduationDate">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="currentInstitution">Instituição Atual</label>
                        <input type="text" id="currentInstitution">
                    </div>
                    <div class="form-group">
                        <label for="currentSpecialty">Especialidade Atual</label>
                        <input type="text" id="currentSpecialty">
                    </div>
                </div>

                <div class="form-group">
                    <label for="desiredSpecialty">Especialidade Desejada (EUA)</label>
                    <input type="text" id="desiredSpecialty">
                </div>

                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </form>
        </div>

        <!-- Change Password -->
        <div class="profile-section">
            <h3>Alterar Senha</h3>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="oldPassword">Senha Atual *</label>
                    <input type="password" id="oldPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">Nova Senha *</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Nova Senha *</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Alterar Senha</button>
            </form>
        </div>

        <!-- Current Exam Preparation -->
        <div class="profile-section">
            <h3>Preparação Atual</h3>
            <form id="currentExamForm">
                <div class="form-group">
                    <label for="currentExam">Prova em Preparação</label>
                    <select id="currentExam">
                        <option value="">Selecione...</option>
                        <option value="step1">Step 1</option>
                        <option value="step2ck">Step 2 CK</option>
                        <option value="step3">Step 3</option>
                        <option value="oet">OET</option>
                        <option value="other">Outro</option>
                    </select>
                </div>
                <div class="form-group hidden" id="otherExamGroup">
                    <label for="otherExam">Especifique</label>
                    <input type="text" id="otherExam">
                </div>
                <button type="submit" class="btn btn-primary">Atualizar</button>
            </form>
        </div>

        <!-- Diary Settings (Students Only) -->
        <div class="profile-section" id="diarySettings">
            <h3>Diários</h3>
            <div class="diary-toggles">
                <div class="diary-toggle">
                    <label class="toggle-label">
                        <input type="checkbox" id="studyDiaryToggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Ativar Diário de Estudos</span>
                    </label>
                    <p class="toggle-description">Registre diariamente o que você estudou (máximo 250 caracteres)</p>
                </div>
                <div class="diary-toggle">
                    <label class="toggle-label">
                        <input type="checkbox" id="uworldDiaryToggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Ativar Diário UWorld</span>
                    </label>
                    <p class="toggle-description">Registre suas sessões diárias do UWorld</p>
                </div>
            </div>
        </div>

        <!-- Questionnaire Progress (Students Only) -->
        <div class="profile-section" id="questionnaireSection">
            <h3>Questionário Inicial</h3>
            <div id="questionnaireStatus">
                <!-- Will be populated dynamically -->
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/header.js"></script>
    <script>
        let currentUser = getCurrentUser();
        let isMentor = false;

        if (!currentUser) {
            window.location.href = 'index.html';
        }

        isMentor = currentUser.user_type && currentUser.user_type.startsWith('mentor_');

        // Initialize header
        initHeader('profile');

        // Hide diary settings for mentors
        if (isMentor) {
            document.getElementById('diarySettings').style.display = 'none';
            document.getElementById('questionnaireSection').style.display = 'none';
        }

        // Current exam selector
        document.getElementById('currentExam').addEventListener('change', (e) => {
            const otherGroup = document.getElementById('otherExamGroup');
            if (e.target.value === 'other') {
                otherGroup.classList.remove('hidden');
            } else {
                otherGroup.classList.add('hidden');
            }
        });

        // Load profile data
        async function loadProfile() {
            try {
                const sb = initSupabase();
                const { data: profile, error } = await sb
                    .from('user_profiles')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .maybeSingle();

                if (error && error.code !== 'PGRST116') throw error;

                if (profile) {
                    document.getElementById('fullName').value = profile.full_name || '';
                    document.getElementById('cpf').value = profile.cpf || '';
                    document.getElementById('orcid').value = profile.orcid || '';
                    document.getElementById('addressLine1').value = profile.address_line1 || '';
                    document.getElementById('addressLine2').value = profile.address_line2 || '';
                    document.getElementById('city').value = profile.city || '';
                    document.getElementById('stateProvince').value = profile.state_province || '';
                    document.getElementById('postalCode').value = profile.postal_code || '';
                    document.getElementById('country').value = profile.country || '';
                    document.getElementById('medicalSchool').value = profile.medical_school || '';
                    document.getElementById('graduationDate').value = profile.medical_graduation_date || '';
                    document.getElementById('currentInstitution').value = profile.current_institution || '';
                    document.getElementById('currentSpecialty').value = profile.current_specialty || '';
                    document.getElementById('desiredSpecialty').value = profile.desired_us_specialty || '';
                }

                document.getElementById('email').value = currentUser.email;

                // Load user settings
                if (!isMentor) {
                    await loadUserSettings();
                    await loadQuestionnaireProgress();
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        async function loadUserSettings() {
            try {
                const sb = initSupabase();
                const { data: settings, error } = await sb
                    .from('user_settings')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .maybeSingle();

                if (error && error.code !== 'PGRST116') throw error;

                if (settings) {
                    document.getElementById('studyDiaryToggle').checked = settings.study_diary_enabled || false;
                    document.getElementById('uworldDiaryToggle').checked = settings.uworld_diary_enabled || false;
                    document.getElementById('currentExam').value = settings.current_exam_prep || '';
                }
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        }

        async function loadQuestionnaireProgress() {
            try {
                const sb = initSupabase();
                const { data: progress, error } = await sb
                    .from('questionnaire_progress')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .maybeSingle();

                const statusDiv = document.getElementById('questionnaireStatus');

                if (error && error.code !== 'PGRST116') throw error;

                if (progress && progress.completed) {
                    statusDiv.innerHTML = '<p class="success-message">✅ Questionário completo!</p>';
                } else {
                    const currentPage = progress?.current_page || 1;
                    const totalPages = 8;
                    statusDiv.innerHTML = `
                        <p class="info-message">Questionário incompleto (${currentPage}/${totalPages} páginas)</p>
                        <a href="questionnaire.html" class="btn btn-primary">Continuar Questionário</a>
                    `;
                }
            } catch (error) {
                console.error('Error loading questionnaire progress:', error);
            }
        }

        // Profile form submit
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const profileData = {
                user_id: currentUser.id,
                full_name: document.getElementById('fullName').value,
                cpf: document.getElementById('cpf').value,
                orcid: document.getElementById('orcid').value,
                address_line1: document.getElementById('addressLine1').value,
                address_line2: document.getElementById('addressLine2').value,
                city: document.getElementById('city').value,
                state_province: document.getElementById('stateProvince').value,
                postal_code: document.getElementById('postalCode').value,
                country: document.getElementById('country').value,
                medical_school: document.getElementById('medicalSchool').value,
                medical_graduation_date: document.getElementById('graduationDate').value || null,
                current_institution: document.getElementById('currentInstitution').value,
                current_specialty: document.getElementById('currentSpecialty').value,
                desired_us_specialty: document.getElementById('desiredSpecialty').value,
                updated_at: new Date().toISOString()
            };

            try {
                const sb = initSupabase();
                const { error } = await sb
                    .from('user_profiles')
                    .upsert(profileData);

                if (error) throw error;
                alert('Perfil atualizado com sucesso!');
            } catch (error) {
                console.error('Error saving profile:', error);
                alert('Erro ao salvar perfil. Tente novamente.');
            }
        });

        // Password form submit
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert('As senhas não coincidem!');
                return;
            }

            if (newPassword.length < 6) {
                alert('A senha deve ter pelo menos 6 caracteres!');
                return;
            }

            // Verify old password
            if (currentUser.password_hash !== oldPassword) {
                alert('Senha atual incorreta!');
                return;
            }

            try {
                const sb = initSupabase();
                const { error } = await sb
                    .from('users')
                    .update({ password_hash: newPassword })
                    .eq('id', currentUser.id);

                if (error) throw error;

                // Update session
                const updatedUser = { ...currentUser, password_hash: newPassword };
                sessionStorage.setItem('currentUser', JSON.stringify(updatedUser));

                alert('Senha alterada com sucesso!');
                document.getElementById('passwordForm').reset();
            } catch (error) {
                console.error('Error changing password:', error);
                alert('Erro ao alterar senha. Tente novamente.');
            }
        });

        // Current exam form submit
        document.getElementById('currentExamForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const currentExam = document.getElementById('currentExam').value;
            const otherExam = document.getElementById('otherExam').value;

            try {
                const sb = initSupabase();
                const { error } = await sb
                    .from('user_settings')
                    .upsert({
                        user_id: currentUser.id,
                        current_exam_prep: currentExam === 'other' ? otherExam : currentExam
                    });

                if (error) throw error;
                alert('Preparação atualizada!');
            } catch (error) {
                console.error('Error updating exam:', error);
                alert('Erro ao atualizar.');
            }
        });

        // Diary toggles
        if (!isMentor) {
            document.getElementById('studyDiaryToggle').addEventListener('change', async (e) => {
                await updateDiarySettings('study_diary_enabled', e.target.checked);
            });

            document.getElementById('uworldDiaryToggle').addEventListener('change', async (e) => {
                await updateDiarySettings('uworld_diary_enabled', e.target.checked);
            });
        }

        async function updateDiarySettings(field, value) {
            try {
                const sb = initSupabase();
                const { error } = await sb
                    .from('user_settings')
                    .upsert({
                        user_id: currentUser.id,
                        [field]: value
                    });

                if (error) throw error;

                // Update header
                const studyEnabled = document.getElementById('studyDiaryToggle').checked;
                const uworldEnabled = document.getElementById('uworldDiaryToggle').checked;
                updateHeaderLinks(studyEnabled, uworldEnabled);

                alert('Configuração salva! A página do diário agora está ' + (value ? 'visível' : 'oculta') + ' no menu.');
            } catch (error) {
                console.error('Error updating diary settings:', error);
                alert('Erro ao salvar configuração.');
            }
        }

        // Load profile on page load
        loadProfile();
    </script>

    <style>
        .profile-section {
            background: white;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .profile-section h3 {
            margin: 0 0 20px 0;
            color: var(--color-primary);
            border-bottom: 2px solid var(--color-primary);
            padding-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .diary-toggles {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .diary-toggle {
            padding: 15px;
            background: var(--color-light-gray);
            border-radius: 8px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-weight: 600;
        }

        .toggle-label input[type="checkbox"] {
            display: none;
        }

        .toggle-slider {
            position: relative;
            width: 50px;
            height: 26px;
            background: #ccc;
            border-radius: 13px;
            transition: background 0.3s;
        }

        .toggle-slider::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-label input[type="checkbox"]:checked + .toggle-slider {
            background: var(--color-primary);
        }

        .toggle-label input[type="checkbox"]:checked + .toggle-slider::after {
            transform: translateX(24px);
        }

        .toggle-description {
            margin: 10px 0 0 65px;
            font-size: 14px;
            color: #666;
        }

        .success-message {
            color: #4caf50;
            font-weight: bold;
        }

        .info-message {
            color: #666;
            margin-bottom: 15px;
        }
    </style>
</body>
</html>
