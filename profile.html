<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Ward Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <!-- Header de Navegação -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">WARD ACADEMY</span>
            </div>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="landmarks.html" class="nav-link">Landmarks</a>
                <a href="schedule.html" class="nav-link">Cronograma</a>
                <a href="links.html" class="nav-link">Links</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="research.html" class="nav-link">Pesquisa</a>
                <a href="study-diary.html" class="nav-link diary-link" id="studyDiaryLink" style="display: none;">Diário Estudos</a>
                <a href="uworld-diary.html" class="nav-link diary-link" id="uworldDiaryLink" style="display: none;">Diário UWorld</a>
            </nav>
            <div class="header-actions">
                <a href="profile.html" class="btn-icon active" title="Perfil">
                    <span>👤</span>
                    <span class="btn-text">Perfil</span>
                </a>
                <button onclick="logout()" class="btn-icon btn-logout" title="Sair">
                    <span>🚪</span>
                    <span class="btn-text">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-main">
        <div class="dashboard-container">
            <!-- Page Header -->
            <section class="welcome-section">
                <h1>👤 Meu Perfil</h1>
            </section>

            <!-- Profile Card -->
            <div class="dashboard-card">
                <!-- Tab Navigation -->
                <div class="tab-navigation">
                    <button class="tab-btn active" data-tab="basic">📋 Dados Básicos</button>
                    <button class="tab-btn" data-tab="usmle">🎓 USMLE</button>
                    <button class="tab-btn" data-tab="prep">📚 Prep</button>
                    <button class="tab-btn" data-tab="research">🔬 Pesquisa</button>
                    <button class="tab-btn" data-tab="observerships">🏥 Estágios</button>
                </div>

                <!-- Tab: Dados Básicos -->
                <div class="tab-content active" id="tab-basic">
                    <div class="card-body">
                        <h3 class="section-title">Informações Pessoais</h3>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Nome Completo</label>
                                <input type="text" id="name" class="input-profile" readonly>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" class="input-profile" readonly>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Qual prova você está fazendo?</label>
                                <select id="exam_taking" class="input-profile" disabled>
                                    <option value="">Selecione...</option>
                                    <option value="step1">Step 1</option>
                                    <option value="step2ck">Step 2 CK</option>
                                    <option value="step3">Step 3</option>
                                    <option value="oet">OET</option>
                                    <option value="other">Outro</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Data de Início dos Estudos</label>
                                <input type="date" id="study_start_date" class="input-profile" readonly>
                            </div>
                            <div class="form-group">
                                <label>Data da Prova (Estimada)</label>
                                <input type="date" id="test_date" class="input-profile" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab: USMLE -->
                <div class="tab-content" id="tab-usmle">
                    <div class="card-body">
                        <h3 class="section-title">Planejamento USMLE</h3>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Duração First Pass (meses)</label>
                                <input type="number" id="first_pass_months" class="input-profile" readonly min="1" max="24">
                            </div>
                            <div class="form-group">
                                <label>Duração Second Pass (meses)</label>
                                <input type="number" id="second_pass_months" class="input-profile" readonly min="1" max="12">
                            </div>
                            <div class="form-group">
                                <label>Duração Dedicated (meses)</label>
                                <input type="number" id="dedicated_months" class="input-profile" readonly min="1" max="6">
                            </div>
                        </div>

                        <h3 class="section-title mt-3">UWorld</h3>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Prova do UWorld</label>
                                <select id="uworld_exam" class="input-profile" disabled>
                                    <option value="">Selecione...</option>
                                    <option value="step1">Step 1</option>
                                    <option value="step2ck">Step 2 CK</option>
                                    <option value="step3">Step 3</option>
                                </select>
                            </div>
                        </div>

                        <div id="uworldSystemsList" class="uworld-systems-list">
                            <!-- Populated dynamically by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Tab: Prep -->
                <div class="tab-content" id="tab-prep">
                    <div class="card-body">
                        <h3 class="section-title">Inglês</h3>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Nível de Inglês</label>
                                <select id="english_level" class="input-profile" disabled>
                                    <option value="">Selecione...</option>
                                    <option value="basic">Básico</option>
                                    <option value="intermediate">Intermediário</option>
                                    <option value="advanced">Avançado</option>
                                    <option value="fluent">Fluente</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row" id="englishStudyRow" style="display: none;">
                            <div class="form-group full-width">
                                <label>Estudando Inglês?</label>
                                <div class="radio-group-inline">
                                    <label class="radio-label-compact">
                                        <input type="radio" name="english_studying" value="yes" disabled>
                                        <span>Sim</span>
                                    </label>
                                    <label class="radio-label-compact">
                                        <input type="radio" name="english_studying" value="no" disabled>
                                        <span>Não</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <h3 class="section-title mt-3">Anki</h3>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label>Usa Anki?</label>
                                <div class="radio-group-inline">
                                    <label class="radio-label-compact">
                                        <input type="radio" name="anki_usage" value="yes" disabled>
                                        <span>Sim</span>
                                    </label>
                                    <label class="radio-label-compact">
                                        <input type="radio" name="anki_usage" value="no" disabled>
                                        <span>Não</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div id="ankiDetailsRow" style="display: none;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Deck do Anki</label>
                                    <input type="text" id="anki_deck" class="input-profile" readonly placeholder="Ex: AnKing, Zanki, etc.">
                                </div>
                                <div class="form-group">
                                    <label>Cards por dia</label>
                                    <input type="number" id="anki_cards_per_day" class="input-profile" readonly min="0">
                                </div>
                            </div>
                        </div>

                        <h3 class="section-title mt-3">Recursos</h3>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label>Recursos adicionais (First Aid, Pathoma, Sketchy, etc.)</label>
                                <textarea id="additional_resources" class="input-profile textarea-profile" readonly rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Pesquisa -->
                <div class="tab-content" id="tab-research">
                    <div class="card-body">
                        <h3 class="section-title">Projetos de Pesquisa</h3>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label>Tem projetos de pesquisa?</label>
                                <div class="radio-group-inline">
                                    <label class="radio-label-compact">
                                        <input type="radio" name="has_research" value="yes" disabled>
                                        <span>Sim</span>
                                    </label>
                                    <label class="radio-label-compact">
                                        <input type="radio" name="has_research" value="no" disabled>
                                        <span>Não</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div id="researchDetailsRow" style="display: none;">
                            <div class="form-row">
                                <div class="form-group full-width">
                                    <label>Descrição dos Projetos</label>
                                    <textarea id="research_description" class="input-profile textarea-profile" readonly rows="4" placeholder="Descreva seus projetos de pesquisa..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab: Estágios (Observerships) -->
                <div class="tab-content" id="tab-observerships">
                    <div class="card-body">
                        <h3 class="section-title">Estágios de Observação</h3>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label>Tem observerships planejados ou concluídos?</label>
                                <div class="radio-group-inline">
                                    <label class="radio-label-compact">
                                        <input type="radio" name="has_observerships" value="yes" disabled>
                                        <span>Sim</span>
                                    </label>
                                    <label class="radio-label-compact">
                                        <input type="radio" name="has_observerships" value="no" disabled>
                                        <span>Não</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div id="observershipsDetailsRow" style="display: none;">
                            <div class="form-row">
                                <div class="form-group full-width">
                                    <label>Descrição dos Estágios</label>
                                    <textarea id="observerships_description" class="input-profile textarea-profile" readonly rows="4" placeholder="Descreva seus estágios de observação..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="card-footer">
                    <button id="editBtn" class="btn btn-primary" onclick="toggleEditMode()">
                        ✏️ Editar Perfil
                    </button>
                    <button id="saveBtn" class="btn btn-success" onclick="saveProfile()" style="display: none;">
                        💾 Salvar Alterações
                    </button>
                    <button id="cancelBtn" class="btn btn-secondary" onclick="cancelEdit()" style="display: none;">
                        ❌ Cancelar
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/questionnaire-data.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
