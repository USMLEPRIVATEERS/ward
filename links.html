<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - Ward Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/links.css">
</head>
<body>
    <!-- Header de Navegação -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">WARD ACADEMY</span>
            </div>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="landmarks.html" class="nav-link">Landmarks</a>
                <a href="schedule.html" class="nav-link">Cronograma</a>
                <a href="links.html" class="nav-link active">Links</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="research.html" class="nav-link">Pesquisa</a>
                <a href="study-diary.html" class="nav-link diary-link" id="studyDiaryLink" style="display: none;">Diário Estudos</a>
                <a href="uworld-diary.html" class="nav-link diary-link" id="uworldDiaryLink" style="display: none;">Diário UWorld</a>
            </nav>
            <div class="header-actions">
                <a href="profile.html" class="btn-icon" title="Perfil">
                    <span>👤</span>
                    <span class="btn-text">Perfil</span>
                </a>
                <button onclick="logout()" class="btn-icon btn-logout" title="Sair">
                    <span>🚪</span>
                    <span class="btn-text">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-main">
        <div class="dashboard-container">
            <!-- Page Header -->
            <section class="welcome-section">
                <h1>🔗 Repositório de Links</h1>
                <button class="btn btn-primary" id="addLinkBtn">
                    + Adicionar Link
                </button>
            </section>

            <!-- Filters Section -->
            <div class="dashboard-card">
                <div class="card-body">
                    <!-- Search Bar -->
                    <div class="search-bar">
                        <input type="text" id="searchInput" class="input-search" placeholder="🔍 Buscar links...">
                    </div>

                    <!-- Filter Buttons -->
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-category="all">Todos</button>
                        <button class="filter-btn" data-category="step1">Step 1</button>
                        <button class="filter-btn" data-category="step2ck">Step 2 CK</button>
                        <button class="filter-btn" data-category="step3">Step 3</button>
                        <button class="filter-btn" data-category="oet">OET</button>
                        <button class="filter-btn" data-category="research">Pesquisa</button>
                    </div>
                </div>
            </div>

            <!-- Links Container -->
            <div id="linksContainer" class="links-container">
                <!-- Links will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Modal: Add/Edit Link -->
    <div id="linkModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeLinkModal()"></div>
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3 id="modalTitle">Adicionar Link</h3>
                <button class="modal-close" onclick="closeLinkModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="linkForm">
                    <div class="form-group">
                        <label for="linkTitle">Título *</label>
                        <input type="text" id="linkTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="linkUrl">URL *</label>
                        <input type="url" id="linkUrl" required placeholder="https://">
                    </div>

                    <div class="form-group">
                        <label for="linkDescription">Descrição *</label>
                        <textarea id="linkDescription" rows="3" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="linkCategory">Categoria *</label>
                        <select id="linkCategory" required>
                            <option value="">Selecione a categoria...</option>
                            <option value="step1">Step 1</option>
                            <option value="step2ck">Step 2 CK</option>
                            <option value="step3">Step 3</option>
                            <option value="oet">OET</option>
                            <option value="research">Pesquisa</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeLinkModal()">
                    Cancelar
                </button>
                <button type="button" class="btn btn-primary" onclick="saveLinkForm()">
                    Salvar
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/links.js"></script>
</body>
</html>
